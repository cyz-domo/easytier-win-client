name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: check-x64

      - name: Cache protoc
        uses: actions/cache@v4
        id: protoc-cache
        with:
          path: C:\tools\protoc
          key: protoc-v25

      - name: Install protoc
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: choco install protoc -y

      - name: Install dependencies
        run: npm ci

      - name: Test frontend codec
        run: npm run test:codec

      - name: Stage easytier third_party link libs
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $tp = Resolve-Path "$cargoHome\git\checkouts\easytier-*\*\easytier\third_party" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tp) { throw 'easytier third_party not found' }
          New-Item -ItemType Directory -Force -Path src-tauri/easytier | Out-Null
          Copy-Item -Recurse -Force -Path $tp.Path -Destination src-tauri/easytier/third_party

      - name: cargo check (workspace)
        run: cargo check --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml --all-targets

      - name: TypeScript check
        run: npx tsc --noEmit
