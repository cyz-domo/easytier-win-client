# Temporary probe: runs the exact standalone-portable body from release.yml against a
# stubbed bundle so the WebView2 extraction recipe can be validated in minutes instead
# of a full release build. Delete once proven.
name: WV2 standalone extraction probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe standalone packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'easytier-win-client_x64_portable' | Out-Null
          Set-Content -Path 'easytier-win-client_x64_portable/placeholder.txt' -Value 'stub for the probe'
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          $bundle = 'easytier-win-client_x64_portable'
          $bundleStandalone = "easytier-win-client_x64_portable_standalone"
          if (-not (Test-Path $bundle)) { throw "Missing $bundle produced by the previous step" }
          New-Item -ItemType Directory -Force -Path "$bundleStandalone" | Out-Null
          Copy-Item "$bundle/*" "$bundleStandalone" -Recurse -Force

          # The fwlink installer is an EdgeUpdate setup whose 212 MB payload is one
          # opaque compressed blob: no MSI/CAB/ZIP can be carved out of it offline,
          # so the runtime files only exist after a real install. The runner is an
          # ephemeral VM, and src-tauri/src/main.rs points WebView2 at the copied
          # folder through WEBVIEW2_BROWSER_EXECUTABLE_FOLDER, which is exactly the
          # fixed-version layout a portable package needs.
          $wv2Installer = Join-Path $env:RUNNER_TEMP 'wv2-installer.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124701' -OutFile $wv2Installer
          if (-not (Test-Path $wv2Installer)) { throw 'WebView2 standalone installer was not downloaded' }

          $appRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          function Find-Webview2Runtime {
            Get-ChildItem -Path $appRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName 'msedgewebview2.exe') } |
              Sort-Object -Descending Name |
              Select-Object -First 1
          }

          $runtime = $null
          $lastExit = $null
          foreach ($argSet in @('/silent /install', '--install --silent')) {
            $installer = Start-Process -FilePath $wv2Installer -ArgumentList $argSet.Split(' ') -Wait -PassThru
            $lastExit = $installer.ExitCode
            $runtime = Find-Webview2Runtime
            if ($runtime) { break }
            Write-Host "installer '$argSet' exited $lastExit and left no runtime; trying the next argument set"
          }
          if (-not $runtime) { throw "WebView2 runtime was not installed (last exit code: $lastExit)" }

          New-Item -ItemType Directory -Force -Path $bundleStandalone | Out-Null
          Copy-Item "$bundle/*" $bundleStandalone -Recurse -Force
          Copy-Item -Path (Join-Path $runtime.FullName '*') -Destination (Join-Path $bundleStandalone 'webview2') -Recurse -Force
          if (-not (Test-Path (Join-Path $bundleStandalone 'webview2\msedgewebview2.exe'))) {
            throw "webview2/msedgewebview2.exe missing; runtime dir was $($runtime.FullName)"
          }

          $zipPath = "dist-artifacts/$bundleStandalone.zip"
          Compress-Archive -Path "$bundleStandalone/*" -DestinationPath $zipPath -Force
          $zip = Get-Item $zipPath
          if (-not $zip) { throw "Standalone portable zip was not created at $zipPath" }
          if ($zip.Length -lt 80MB) { throw "Standalone portable zip is only $($zip.Length) bytes; runtime not embedded" }
          Write-Host "Standalone portable: WebView2 $($runtime.Name), $([math]::Round($zip.Length / 1MB, 1)) MB"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path 'dist-artifacts/easytier-win-client_x64_portable_standalone.zip').Path
          $zipFile = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = $zipFile.Entries
            $core = $entries | Where-Object { $_.FullName -eq 'webview2/msedgewebview2.exe' } | Select-Object -First 1
            if (-not $core) { throw 'packaged zip has no webview2/msedgewebview2.exe entry' }
            $wv2 = @($entries | Where-Object { $_.FullName -like 'webview2/*' })
            Write-Host ("zip entries={0} webview2_files={1} webview2_uncompressed_MB={2} core={3}" -f `
              $entries.Count, $wv2.Count, [math]::Round((($wv2 | Measure-Object Length -Sum).Sum / 1MB), 1), $core.Length)
          } finally { $zipFile.Dispose() }
