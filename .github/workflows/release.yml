name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        default: main
        required: false
        type: string
      create_release:
        description: Create a GitHub Release after build (true/false)
        default: false
        required: false
        type: boolean
      version:
        description: Release version tag (e.g. v0.1.0); required if create_release is true
        default: ''
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            core_asset: easytier-windows-x86_64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            core_asset: easytier-windows-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Install protoc
        run: choco install protoc -y

      - name: Test frontend codec
        run: npm run test:codec

      - name: Download EasyTier core
        shell: pwsh
        run: |
          $version = '2.6.4'
          $asset = '${{ matrix.core_asset }}-v' + $version + '.zip'
          $url = 'https://github.com/EasyTier/EasyTier/releases/download/v' + $version + '/' + $asset
          New-Item -ItemType Directory -Force -Path src-tauri/core-stage | Out-Null
          Invoke-WebRequest -Uri $url -OutFile easytier-core.zip
          Expand-Archive -Path easytier-core.zip -DestinationPath core-expanded -Force
          $core = Get-ChildItem -Path core-expanded -Recurse -Filter easytier-core.exe | Select-Object -First 1
          if (-not $core) { throw 'easytier-core.exe not found in downloaded archive' }
          Copy-Item -Path ($core.DirectoryName + '/*') -Destination src-tauri/core-stage -Recurse -Force
          if (-not (Test-Path src-tauri/core-stage/easytier-cli.exe)) { throw 'easytier-cli.exe not found in downloaded archive' }

      - name: Stage easytier third_party link libs
        shell: pwsh
        run: |
          # easytier's build script adds a RELATIVE link-search path
          # "easytier/third_party/<arch>/" (Packet.lib etc.); the crate sources
          # live in the cargo git checkout, so mirror them next to src-tauri.
          cargo fetch --manifest-path src-tauri/Cargo.toml
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $tp = Resolve-Path "$cargoHome\git\checkouts\easytier-*\*\easytier\third_party" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tp) { throw 'easytier third_party not found in cargo git checkouts' }
          New-Item -ItemType Directory -Force -Path src-tauri/easytier | Out-Null
          Copy-Item -Recurse -Force -Path $tp.Path -Destination src-tauri/easytier/third_party
          foreach ($required in @('x86_64/Packet.lib','arm64/Packet.lib')) {
            if (-not (Test-Path "src-tauri/easytier/third_party/$required")) { throw "Missing link lib: $required" }
          }

      - name: Build service binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --bin easytier-service

      - name: Build Tauri app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/service-stage | Out-Null
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/easytier-service.exe" "src-tauri/service-stage/easytier-service.exe" -Force
          npm exec tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" "dist-artifacts/"

      - name: Build Offline Tauri installer (x64 only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          # Build offline installer embedding the WebView2 standalone installer
          npm exec tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.offline.conf.json
          $offlineInstaller = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($offlineInstaller) {
            $offlineName = $offlineInstaller.Name -replace '\.exe$', '_offline.exe'
            Copy-Item $offlineInstaller.FullName "dist-artifacts/$offlineName" -Force
          }

      - name: Assemble portable packages
        shell: pwsh
        run: |
          $release = 'src-tauri/target/${{ matrix.target }}/release'
          $bundle = "easytier-win-client_${{ matrix.arch }}_portable"
          New-Item -ItemType Directory -Force -Path "$bundle/core" | Out-Null
          Copy-Item "$release/easytier-win-client.exe" "$bundle/easytier-win-client.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/easytier-service.exe" "$bundle/easytier-service.exe"
          Copy-Item 'src-tauri/core-stage/*' "$bundle/core" -Recurse -Force
          foreach ($required in @('easytier-core.exe','easytier-cli.exe','wintun.dll','WinDivert64.sys','Packet.dll')) {
            if (-not (Test-Path "src-tauri/core-stage/$required")) { throw "Missing runtime file: $required" }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist-artifacts/$bundle.zip" -Force

          # Assemble standalone portable package with embedded WebView2 for x64
          if ('${{ matrix.arch }}' -eq 'x64') {
            $bundleStandalone = "easytier-win-client_x64_portable_standalone"
            New-Item -ItemType Directory -Force -Path "$bundleStandalone" | Out-Null
            Copy-Item "$bundle/*" "$bundleStandalone" -Recurse -Force
            
            try {
              $wv2Url = "https://go.microsoft.com/fwlink/p/?LinkId=2124701"
              $wv2Installer = "$env:RUNNER_TEMP\wv2-installer.exe"
              Invoke-WebRequest -Uri $wv2Url -OutFile $wv2Installer
              
              $sevenZip = "C:\Program Files\7-Zip\7z.exe"
              if (Test-Path $sevenZip) {
                $extractTemp = "$env:RUNNER_TEMP\wv2-extracted"
                & $sevenZip x -y $wv2Installer -o"$extractTemp"
                $exe = Get-ChildItem -Path $extractTemp -Recurse -Filter "msedgewebview2.exe" | Select-Object -First 1
                if ($exe) {
                  Copy-Item -Path ($exe.DirectoryName + '/*') -Destination "$bundleStandalone/webview2" -Recurse -Force
                  Compress-Archive -Path "$bundleStandalone/*" -DestinationPath "dist-artifacts/$bundleStandalone.zip" -Force
                }
              }
            } catch {
              Write-Warning "Failed to unpack standalone webview2: $_"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifacts
          path: dist-artifacts/*

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.create_release == true && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## 📦 EasyTier Windows Client 客户端发布说明

            ### 🚀 安装包与便携包下载指南 / Which version to download?

            | 文件名 | 类型 | 预计体积 | 适用场景与推荐建议 |
            | :--- | :--- | :--- | :--- |
            | **`EasyTier_*_x64-setup.exe`** | **标准安装包（推荐首选）** | ~17 MB | **绝大多数用户推荐下载**。适用于 Windows 11 / Windows 10。安装程序会自动注册后台常驻系统服务；若系统缺少 WebView2，安装器会自动联网静默补齐。 |
            | **`easytier-win-client_x64_portable.zip`** | **标准绿色便携版** | ~24 MB | 解压即用，无任何系统残留。适合日常使用、便携式 U 盘随身携带。 |
            | **`EasyTier_*_x64-setup_offline.exe`** | **离线安装包（纯内网机房）** | ~150 MB | **适合无外网连接的机房/离线局域网**。安装包内嵌了微软官方 WebView2 离线运行时，安装全程无需连接互联网。 |
            | **`easytier-win-client_x64_portable_standalone.zip`** | **完全脱机独立免安装版** | ~180 MB | **适合纯净虚拟机、精简版 Windows（无 Edge / 无任何系统组件）**。内置完整独立 WebView2 运行时，无需安装任何系统组件，解压双击直接运行。 |
            | **`easytier-win-client_arm64_portable.zip`** | **ARM64 便携版** | ~24 MB | 适用于高通骁龙等 ARM 架构的 Windows 电脑（如 Surface Pro X、Copilot+ PC 等）。 |
            | **`EasyTier_*_arm64-setup.exe`** | **ARM64 安装包** | ~17 MB | 适用于 ARM 架构 Windows 电脑的安装包。 |

            ---
            *注：EasyTier 后台核心与服务为纯 Rust 原生进程，即使在完全无界面的 Windows Server 环境下也可作为独立后台服务稳定运行。*
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
