name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        default: main
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            core_asset: easytier-windows-x86_64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            core_asset: easytier-windows-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Test frontend codec
        run: npm run test:codec

      - name: Download EasyTier core
        shell: pwsh
        run: |
          $version = '2.6.4'
          $asset = '${{ matrix.core_asset }}-v' + $version + '.zip'
          $url = 'https://github.com/EasyTier/EasyTier/releases/download/v' + $version + '/' + $asset
          New-Item -ItemType Directory -Force -Path src-tauri/core-stage | Out-Null
          Invoke-WebRequest -Uri $url -OutFile easytier-core.zip
          Expand-Archive -Path easytier-core.zip -DestinationPath core-expanded -Force
          $core = Get-ChildItem -Path core-expanded -Recurse -Filter easytier-core.exe | Select-Object -First 1
          if (-not $core) { throw 'easytier-core.exe not found in downloaded archive' }
          Copy-Item -Path ($core.DirectoryName + '/*') -Destination src-tauri/core-stage -Recurse -Force
          if (-not (Test-Path src-tauri/core-stage/easytier-cli.exe)) { throw 'easytier-cli.exe not found in downloaded archive' }

      - name: Build Tauri app
        run: npm exec tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Assemble portable package
        shell: pwsh
        run: |
          $release = 'src-tauri/target/${{ matrix.target }}/release'
          $bundle = 'easytier-win-client_${{ matrix.arch }}_portable'
          New-Item -ItemType Directory -Force -Path "$bundle/core" | Out-Null
          Copy-Item "$release/easytier-win-client.exe" "$bundle/easytier-win-client.exe"
          Copy-Item 'src-tauri/core-stage/*' "$bundle/core" -Recurse -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath "$bundle.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            easytier-win-client_${{ matrix.arch }}_portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
