name: Native UI Package

on:
  workflow_dispatch:
    inputs:
      easytier_version:
        description: EasyTier core release version (without leading v)
        default: '2.6.4'
        required: true
        type: string
      app_version:
        description: App version for the installer (X.Y.Z)
        default: '0.1.5'
        required: true
        type: string

jobs:
  package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            core_asset: easytier-windows-x86_64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            core_asset: easytier-windows-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native-ui
            src-tauri
          key: ${{ matrix.target }}

      - name: Install protoc
        run: choco install protoc -y

      - name: Download EasyTier core
        shell: pwsh
        run: |
          $version = '${{ inputs.easytier_version }}'
          $asset = '${{ matrix.core_asset }}-v' + $version + '.zip'
          $url = 'https://github.com/EasyTier/EasyTier/releases/download/v' + $version + '/' + $asset
          New-Item -ItemType Directory -Force -Path core-stage | Out-Null
          Invoke-WebRequest -Uri $url -OutFile easytier-core.zip
          Expand-Archive -Path easytier-core.zip -DestinationPath core-expanded -Force
          $core = Get-ChildItem -Path core-expanded -Recurse -Filter easytier-core.exe | Select-Object -First 1
          if (-not $core) { throw 'easytier-core.exe not found in downloaded archive' }
          Copy-Item -Path ($core.DirectoryName + '/*') -Destination core-stage -Recurse -Force
          foreach ($required in @('easytier-core.exe','easytier-cli.exe','wintun.dll','WinDivert64.sys','Packet.dll')) {
            if (-not (Test-Path "core-stage/$required")) { throw "Missing runtime file: $required" }
          }

      - name: Stage easytier third_party link libs
        shell: pwsh
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $tp = Resolve-Path "$cargoHome\git\checkouts\easytier-*\*\easytier\third_party" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tp) { throw 'easytier third_party not found in cargo git checkouts' }
          New-Item -ItemType Directory -Force -Path src-tauri/easytier | Out-Null
          Copy-Item -Recurse -Force -Path $tp.Path -Destination src-tauri/easytier/third_party
          foreach ($required in @('x86_64/Packet.lib','arm64/Packet.lib')) {
            if (-not (Test-Path "src-tauri/easytier/third_party/$required")) { throw "Missing link lib: $required" }
          }

      - name: Build service binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --bin easytier-service

      - name: Build native UI
        run: cargo build --release --target ${{ matrix.target }} --manifest-path native-ui/Cargo.toml

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          $bundle = 'easytier-native-ui_${{ matrix.arch }}_portable'
          New-Item -ItemType Directory -Force -Path "$bundle/core" | Out-Null
          Copy-Item "native-ui/target/${{ matrix.target }}/release/easytier-native-ui.exe" "$bundle/easytier-native-ui.exe"
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/easytier-service.exe" "$bundle/easytier-service.exe"
          Copy-Item 'core-stage/*' "$bundle/core" -Recurse -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist-artifacts/$bundle.zip" -Force
          $zip = Get-Item "dist-artifacts/$bundle.zip"
          Write-Host ("Portable package: {0} ({1:N1} MB)" -f $zip.Name, ($zip.Length / 1MB))

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { choco install nsis -y; $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe' }
          if (-not (Test-Path $makensis)) { throw 'makensis.exe not found' }
          New-Item -ItemType Directory -Force -Path dist-stage | Out-Null
          $stage = (Resolve-Path 'dist-stage').Path
          Copy-Item "native-ui/target/${{ matrix.target }}/release/easytier-native-ui.exe" 'dist-stage/easytier-native-ui.exe'
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/easytier-service.exe" 'dist-stage/easytier-service.exe'
          Copy-Item 'core-stage/*' 'dist-stage/core' -Recurse -Force
          $out = (Join-Path (Resolve-Path 'dist-artifacts').Path 'EasyTier-Native-${{ inputs.app_version }}-${{ matrix.arch }}-setup.exe')
          $icon = (Resolve-Path 'native-ui/assets/icon.ico').Path
          & $makensis "/DAPP_VERSION=${{ inputs.app_version }}" "/DARCH=${{ matrix.arch }}" "/DSTAGE=$stage" "/DOUTFILE=$out" "/DICON=$icon" 'native-ui/installer/installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Get-Item $out | ForEach-Object { Write-Host ("Installer: {0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB)) }

      - uses: actions/upload-artifact@v4
        with:
          name: easytier-native-ui-package-${{ matrix.arch }}
          path: dist-artifacts/*
          if-no-files-found: error
