[package]
name = "easytier-native-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native egui UI spike for the EasyTier Windows client"
license = "MIT"
publish = false

[workspace]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
