[package]
name = "easytier-native-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Native egui UI spike for the EasyTier Windows client"
license = "MIT"
publish = false

[workspace]

[build-dependencies]
winresource = "0.1"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
png = "0.17"
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
