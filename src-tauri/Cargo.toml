[package]
name = "easytier-win-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "easytier_win_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri = { version = "2", features = [] }
wait-timeout = "0.2"
